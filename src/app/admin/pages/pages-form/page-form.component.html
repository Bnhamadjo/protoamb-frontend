<div class="pages-form anim-fade-in">
  <header class="form-header" style="margin-bottom: 30px;">
    <h1>{{ slug === 'new' ? 'Nova Pagina' : 'Editar Pagina' }}</h1>
    <p class="muted">Crie e edite as paginas institucionais do portal.</p>
  </header>

  <div *ngIf="loading" class="center-box card">
    <div class="spinner"></div>
    <p class="muted">Carregando dados da pagina...</p>
  </div>

  <div *ngIf="error" class="error-banner card" style="background: #FEF2F2; color: #DC2626; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; border: 1px solid #FEE2E2;">
    <span>Aviso</span> {{ error }}
    <button (click)="error = ''" class="btn ghost sm" style="margin-left: auto;">x</button>
  </div>

  <form *ngIf="!loading" (ngSubmit)="save()" class="card" style="position: relative;">
    <div *ngIf="saving" class="loading-overlay">
       <div class="center-box">
         <div class="spinner"></div>
         <p class="muted">A guardar...</p>
       </div>
    </div>

    <div class="form-group">
      <label>Titulo da Pagina</label>
      <input [(ngModel)]="page.title" name="title" required placeholder="Ex: Sobre o MAP, Contactos">
    </div>

    <div class="featured-image-section" style="margin: 20px 0; padding: 24px; border: 2px dashed var(--border); border-radius: 12px; background: #F8FAFC;">
      <div style="display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:16px;">
        <div>
          <label>Imagem Hero / Destaque</label>
          <p class="muted" style="margin:6px 0 0;">Selecione a partir da galeria. Se nao existir, carregue dentro da biblioteca.</p>
        </div>
        <button type="button" class="btn outline sm" (click)="openImagePicker()">Abrir galeria</button>
      </div>

      <div *ngIf="page.featured_image" class="preview-container" style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
        <img [src]="page.featured_image" alt="Preview" style="max-width: 100%; max-height: 250px; border-radius: 12px; box-shadow: var(--shadow);">
        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
          <button type="button" class="btn outline sm" (click)="openImagePicker()">Trocar pela galeria</button>
          <button type="button" class="btn danger sm" (click)="removeImage()">Remover imagem</button>
        </div>
      </div>

      <div *ngIf="!page.featured_image" class="upload-placeholder" style="display: flex; justify-content: center; padding: 20px;">
        <button type="button" class="btn outline" (click)="openImagePicker()">
          <span>Selecionar imagem da galeria</span>
        </button>
      </div>
    </div>

    <div class="form-group">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <label style="margin: 0;">Conteudo da Pagina</label>
        <button type="button" class="btn ghost sm" (click)="showSource = !showSource">
          {{ showSource ? '[ Ver Editor Visual ]' : '[ < > Ver Código ]' }}
        </button>
      </div>
      
      <quill-editor 
        *ngIf="!showSource"
        [(ngModel)]="page.content" 
        name="content" 
        [styles]="{ height: '400px', 'background': '#fff' }"
        placeholder="Desenvolva o conteudo aqui..."
      ></quill-editor>

      <textarea
        *ngIf="showSource"
        [(ngModel)]="page.content"
        name="content_source"
        style="width: 100%; height: 400px; font-family: monospace; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: #1e1e1e; color: #d4d4d4;"
        placeholder="Adicione o código HTML aqui..."
      ></textarea>
    </div>

    <div class="grid-3">
      <div class="form-group">
        <label>Pagina Pai (Hierarquia)</label>
        <select [(ngModel)]="page.parent_id" name="parent_id">
          <option [ngValue]="null">Nenhuma (Pagina de Nivel 1)</option>
          <option *ngFor="let p of pages" [value]="p.id">{{ p.title }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select [(ngModel)]="page.status" name="status">
          <option value="draft">Rascunho</option>
          <option value="published">Ativa</option>
        </select>
      </div>

      <div class="form-group">
        <label>Idioma</label>
        <select [(ngModel)]="page.lang" name="lang">
          <option value="pt">Portugues</option>
          <option value="fr">Frances</option>
          <option value="en">Ingles</option>
        </select>
      </div>
    </div>

    <div class="actions" style="display: flex; gap: 15px; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border);">
      <button type="submit" class="btn primary lg" [disabled]="saving">
        {{ saving ? 'Processando...' : 'Salvar Pagina' }}
      </button>
      <a class="btn outline lg" routerLink="/admin/pages">Cancelar</a>
    </div>
  </form>
</div>

<app-media-picker
  [visible]="imagePickerOpen"
  mode="image"
  title="Galeria para imagem da pagina"
  (close)="imagePickerOpen = false"
  (selected)="onImageSelected($event)">
</app-media-picker>
